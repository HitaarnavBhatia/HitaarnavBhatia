name: Refresh README cards

on:
  schedule:
    - cron: "17 20 * * *"   # every morning in Brisbane (06:17 AEST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "data/portrait.txt", "fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, graph, activity, tiles, stack, repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_readme_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
